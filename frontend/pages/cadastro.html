<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cadastro - Conexxa Platform" />
    <title>Cadastro - Conexxa</title>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-wrapper">
        <div class="login-card">
          <div class="logo-section">
            <h1 class="logo">Conexxa</h1>
            <p class="tagline">Crie sua conta agora</p>
          </div>

          <form id="signupForm" class="login-form" novalidate>
            <div class="form-group">
              <label for="nome" class="form-label">Nome Completo</label>
              <input
                type="text"
                id="nome"
                name="nome"
                class="form-input"
                placeholder="Seu Nome"
                required
                aria-label="Nome completo"
                aria-describedby="nomeError"
              />
              <span id="nomeError" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="seu@email.com"
                required
                aria-label="E-mail"
                aria-describedby="emailError"
              />
              <span id="emailError" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="senha" class="form-label">Senha</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="senha"
                  name="senha"
                  class="form-input"
                  placeholder="••••••••"
                  required
                  aria-label="Senha"
                  aria-describedby="senhaError"
                />
                <button
                  type="button"
                  class="toggle-password"
                  aria-label="Mostrar/Ocultar senha"
                  id="togglePassword"
                >
                  <span class="icon">👁️</span>
                </button>
              </div>
              <span id="senhaError" class="error-message" role="alert"></span>
              <small class="password-hint">Mínimo 6 caracteres</small>
            </div>

            <div class="form-group">
              <label for="confirmarSenha" class="form-label"
                >Confirmar Senha</label
              >
              <div class="password-wrapper">
                <input
                  type="password"
                  id="confirmarSenha"
                  name="confirmarSenha"
                  class="form-input"
                  placeholder="••••••••"
                  required
                  aria-label="Confirmar Senha"
                  aria-describedby="confirmarSenhaError"
                />
                <button
                  type="button"
                  class="toggle-password"
                  aria-label="Mostrar/Ocultar confirmação de senha"
                  id="toggleConfirmPassword"
                >
                  <span class="icon">👁️</span>
                </button>
              </div>
              <span
                id="confirmarSenhaError"
                class="error-message"
                role="alert"
              ></span>
            </div>

            <div id="generalError" class="error-banner" role="alert"></div>

            <button type="submit" class="btn-submit" id="submitBtn">
              Criar Conta
            </button>

            <div id="successMessage" class="success-message" role="alert"></div>

            <div class="loading-spinner" id="loadingSpinner">
              <div class="spinner"></div>
            </div>
          </form>

          <div class="form-footer">
            <p class="signup-link">
              Já tem conta?
              <a href="login.html" class="link-text">Faça login</a>
            </p>
          </div>
        </div>

        <div class="info-section">
          <h2>Por que se juntar?</h2>
          <ul class="features-list">
            <li>✨ Organize seus grupos de estudo</li>
            <li>📚 Compartilhe materiais e recursos</li>
            <li>💬 Comunicação em tempo real</li>
            <li>📈 Acompanhe o progresso</li>
          </ul>
        </div>
      </div>
    </div>

    <script src="../services/auth-service.js"></script>
    <script src="../validators/form-validator-signup.js"></script>
    <script src="../scripts/app-signup.js"></script>
  </body>
</html>
