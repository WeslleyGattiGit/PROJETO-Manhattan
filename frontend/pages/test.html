<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testes - Conexxa</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
        padding: 2rem;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      h1 {
        color: #007bff;
        margin-bottom: 2rem;
      }

      .test-section {
        background: white;
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .test-section h2 {
        color: #374151;
        font-size: 1.25rem;
        margin-bottom: 1rem;
        border-bottom: 2px solid #007bff;
        padding-bottom: 0.5rem;
      }

      .test-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem;
        margin-bottom: 0.75rem;
        background: #f9fafb;
        border-radius: 0.375rem;
        border-left: 4px solid #d1d5db;
      }

      .test-item.pass {
        background: #ecfdf5;
        border-left-color: #10b981;
      }

      .test-item.fail {
        background: #fef2f2;
        border-left-color: #ef4444;
      }

      .status {
        font-weight: 600;
        font-size: 0.875rem;
        min-width: 60px;
      }

      .status.pass {
        color: #10b981;
      }

      .status.fail {
        color: #ef4444;
      }

      .status.pending {
        color: #f59e0b;
      }

      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
        margin-right: 0.5rem;
        font-weight: 600;
      }

      button:hover {
        background: #0056b3;
      }

      .button-group {
        display: flex;
        gap: 0.5rem;
        margin: 1rem 0;
        flex-wrap: wrap;
      }

      .output {
        background: #1f2937;
        color: #10b981;
        padding: 1rem;
        border-radius: 0.375rem;
        font-family: "Courier New", monospace;
        font-size: 0.875rem;
        max-height: 300px;
        overflow-y: auto;
        margin-top: 1rem;
      }

      .error {
        color: #ef4444;
      }

      .success {
        color: #10b981;
      }

      .warning {
        color: #f59e0b;
      }

      .info {
        color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🧪 Testes - Conexxa Platform</h1>

      <!-- Teste de Utilitários -->
      <div class="test-section">
        <h2>Testes de Utilitários</h2>
        <div class="button-group">
          <button onclick="testUtils()">Executar Testes de Utils</button>
          <button onclick="clearOutput()">Limpar</button>
        </div>
        <div id="utilsOutput" class="output"></div>
      </div>

      <!-- Teste de Validação -->
      <div class="test-section">
        <h2>Testes de Validação</h2>
        <div class="button-group">
          <button onclick="testFormValidator()">Testar FormValidator</button>
          <button onclick="testEmailValidation()">Validar Email</button>
          <button onclick="testPasswordValidation()">Validar Senha</button>
          <button onclick="clearOutput('validatorOutput')">Limpar</button>
        </div>
        <div id="validatorOutput" class="output"></div>
      </div>

      <!-- Teste de Autenticação -->
      <div class="test-section">
        <h2>Testes de Autenticação</h2>
        <div class="button-group">
          <button onclick="testAuthService()">Testar AuthService</button>
          <button onclick="testLocalStorage()">Testar localStorage</button>
          <button onclick="testTokenValidation()">Validar Token</button>
          <button onclick="clearToken()">Limpar Token</button>
          <button onclick="clearOutput('authOutput')">Limpar</button>
        </div>
        <div id="authOutput" class="output"></div>
      </div>

      <!-- Teste de Conectividade -->
      <div class="test-section">
        <h2>Testes de Conectividade</h2>
        <div class="button-group">
          <button onclick="testBackendConnection()">
            Testar Conexão Backend
          </button>
          <button onclick="testNetworkStatus()">Status de Rede</button>
          <button onclick="clearOutput('connectOutput')">Limpar</button>
        </div>
        <div id="connectOutput" class="output"></div>
      </div>

      <!-- Testes de Acessibilidade -->
      <div class="test-section">
        <h2>Testes de Acessibilidade</h2>
        <div class="button-group">
          <button onclick="testAccessibility()">
            Verificar Acessibilidade
          </button>
          <button onclick="testContrast()">Verificar Contraste</button>
          <button onclick="clearOutput('a11yOutput')">Limpar</button>
        </div>
        <div id="a11yOutput" class="output"></div>
      </div>

      <!-- Status Geral -->
      <div class="test-section">
        <h2>📊 Status Geral do Projeto</h2>
        <div class="button-group">
          <button onclick="runAllTests()">Executar Todos os Testes</button>
          <button onclick="showEnvironmentInfo()">
            Informações do Ambiente
          </button>
          <button onclick="clearOutput('statusOutput')">Limpar</button>
        </div>
        <div id="statusOutput" class="output"></div>
      </div>
    </div>

    <script src="../scripts/utils.js"></script>
    <script>
      function log(message, type = "info", outputId = "statusOutput") {
        const output = document.getElementById(outputId);
        const timestamp = new Date().toLocaleTimeString();
        const className =
          type === "error"
            ? "error"
            : type === "success"
              ? "success"
              : type === "warning"
                ? "warning"
                : "info";
        output.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
        output.scrollTop = output.scrollHeight;
      }

      function clearOutput(outputId = "statusOutput") {
        document.getElementById(outputId).innerHTML = "";
      }

      // Testes de Utilitários
      function testUtils() {
        const output = "utilsOutput";
        clearOutput(output);

        log("🧪 Testando Utils...", "info", output);

        // Teste: isValidEmail
        try {
          const testCases = [
            { email: "valid@email.com", expected: true },
            { email: "invalid.email", expected: false },
            { email: "another@test.co.uk", expected: true },
          ];

          let passed = 0;
          testCases.forEach((tc) => {
            const result = Utils.isValidEmail(tc.email);
            if (result === tc.expected) {
              passed++;
              log(`✓ Email "${tc.email}": ${result}`, "success", output);
            } else {
              log(
                `✗ Email "${tc.email}": esperado ${tc.expected}, obteve ${result}`,
                "error",
                output,
              );
            }
          });

          log(
            `Email validation: ${passed}/${testCases.length}`,
            "info",
            output,
          );
        } catch (error) {
          log(`Erro: ${error.message}`, "error", output);
        }

        // Teste: isMobile
        try {
          const isMobile = Utils.isMobile();
          log(`Dispositivo mobile: ${isMobile}`, "info", output);
        } catch (error) {
          log(`Erro: ${error.message}`, "error", output);
        }

        // Teste: isOnline
        try {
          const isOnline = Utils.isOnline();
          log(
            `Online: ${isOnline ? "Sim" : "Não"}`,
            isOnline ? "success" : "warning",
            output,
          );
        } catch (error) {
          log(`Erro: ${error.message}`, "error", output);
        }
      }

      // Testes de Validação
      function testFormValidator() {
        const output = "validatorOutput";
        clearOutput(output);

        log("🧪 Testando FormValidator...", "info", output);

        try {
          if (!window.FormValidator) {
            log("FormValidator não está carregado", "error", output);
            log("Carregue form-validator.js primeiro", "warning", output);
            return;
          }

          log("✓ FormValidator carregado", "success", output);
        } catch (error) {
          log(`Erro: ${error.message}`, "error", output);
        }
      }

      function testEmailValidation() {
        const output = "validatorOutput";
        clearOutput(output);

        const emails = [
          { email: "usuario@example.com", valid: true },
          { email: "teste.silva@company.co.uk", valid: true },
          { email: "invalidemail", valid: false },
          { email: "@example.com", valid: false },
          { email: "user@", valid: false },
        ];

        emails.forEach(({ email, valid }) => {
          const isValid = Utils.isValidEmail(email);
          if (isValid === valid) {
            log(
              `✓ "${email}": ${isValid ? "válido" : "inválido"}`,
              "success",
              output,
            );
          } else {
            log(
              `✗ "${email}": esperado ${valid}, obteve ${isValid}`,
              "error",
              output,
            );
          }
        });
      }

      function testPasswordValidation() {
        const output = "validatorOutput";
        clearOutput(output);

        const passwords = [
          { pwd: "123456", strength: "Fraca" },
          { pwd: "Password123", strength: "Forte" },
          { pwd: "P@ss123", strength: "Muito Forte" },
        ];

        passwords.forEach(({ pwd, strength }) => {
          const result = Utils.validatePasswordStrength(pwd);
          log(`Senha "${pwd}": ${result.strength}`, "info", output);
        });
      }

      // Testes de Autenticação
      function testAuthService() {
        const output = "authOutput";
        clearOutput(output);

        try {
          if (!window.AuthService) {
            log("AuthService não está carregado", "error", output);
            return;
          }

          if (!window.authService) {
            log("Instância authService não existe", "error", output);
            return;
          }

          log("✓ AuthService carregado", "success", output);
          log(`BaseUrl: ${window.authService.baseUrl}`, "info", output);
        } catch (error) {
          log(`Erro: ${error.message}`, "error", output);
        }
      }

      function testLocalStorage() {
        const output = "authOutput";
        clearOutput(output);

        try {
          const hasStorage = Utils.hasLocalStorage();
          log(
            `localStorage disponível: ${hasStorage ? "Sim" : "Não"}`,
            hasStorage ? "success" : "error",
            output,
          );

          if (hasStorage) {
            Utils.setLocalStorage("test", { data: "teste" });
            const retrieved = Utils.getLocalStorage("test");
            log(`✓ Dados armazenados e recuperados`, "success", output);
            log(`Dados: ${JSON.stringify(retrieved)}`, "info", output);
            Utils.removeLocalStorage("test");
            log(`✓ Dados removidos`, "success", output);
          }
        } catch (error) {
          log(`Erro: ${error.message}`, "error", output);
        }
      }

      function testTokenValidation() {
        const output = "authOutput";
        clearOutput(output);

        try {
          const token = window.authService.getToken();
          if (token) {
            log(
              `Token encontrado: ${token.substring(0, 20)}...`,
              "info",
              output,
            );
            const isValid = window.authService.isTokenValid(token);
            log(
              `Token válido: ${isValid ? "Sim" : "Não"}`,
              isValid ? "success" : "error",
              output,
            );

            if (isValid) {
              const info = window.authService.getUserInfo();
              log(
                `Informações do usuário: ${JSON.stringify(info)}`,
                "info",
                output,
              );
            }
          } else {
            log("Nenhum token armazenado", "warning", output);
          }
        } catch (error) {
          log(`Erro: ${error.message}`, "error", output);
        }
      }

      function clearToken() {
        try {
          window.authService.removeToken();
          log("✓ Token removido", "success", "authOutput");
        } catch (error) {
          log(`Erro: ${error.message}`, "error", "authOutput");
        }
      }

      // Testes de Conectividade
      async function testBackendConnection() {
        const output = "connectOutput";
        clearOutput(output);

        log("🔌 Testando conexão com backend...", "info", output);

        try {
          const response = await fetch("http://localhost:3000/");
          if (response) {
            log("✓ Backend respondendo", "success", output);
            log(`Status: ${response.status}`, "info", output);
          }
        } catch (error) {
          log("✗ Backend não respondeu", "error", output);
          log(`Erro: ${error.message}`, "error", output);
          log(
            "Verifique se o backend está rodando em http://localhost:3000",
            "warning",
            output,
          );
        }
      }

      function testNetworkStatus() {
        const output = "connectOutput";
        clearOutput(output);

        const isOnline = navigator.onLine;
        log(
          `Status: ${isOnline ? "Online" : "Offline"}`,
          isOnline ? "success" : "error",
          output,
        );

        window.addEventListener("online", () => {
          log("Conectado à internet", "success", output);
        });

        window.addEventListener("offline", () => {
          log("Desconectado da internet", "error", output);
        });
      }

      // Testes de Acessibilidade
      function testAccessibility() {
        const output = "a11yOutput";
        clearOutput(output);

        log("♿ Testando acessibilidade...", "info", output);

        // Verificar labels
        const labels = document.querySelectorAll("label");
        log(`Labels encontrados: ${labels.length}`, "info", output);

        // Verificar ARIA
        const ariaElements = document.querySelectorAll("[aria-label]");
        log(`Elementos com aria-label: ${ariaElements.length}`, "info", output);

        // Verificar roles
        const roleElements = document.querySelectorAll("[role]");
        log(`Elementos com role: ${roleElements.length}`, "info", output);

        // Verificar headings
        const headings = document.querySelectorAll("h1, h2, h3, h4, h5, h6");
        log(`Headings encontrados: ${headings.length}`, "info", output);

        if (headings.length === 0) {
          log("⚠️ Nenhum heading encontrado", "warning", output);
        }
      }

      function testContrast() {
        const output = "a11yOutput";
        clearOutput(output);

        log("🎨 Testando contraste...", "info", output);

        // Cores do projeto
        const colors = {
          Primário: "#007bff",
          Sucesso: "#10b981",
          Erro: "#ef4444",
          Branco: "#ffffff",
          "Cinza Escuro": "#374151",
        };

        Object.entries(colors).forEach(([name, color]) => {
          log(`${name}: ${color}`, "info", output);
        });

        log("✓ Cores da identidade visual verificadas", "success", output);
      }

      // Executar todos os testes
      async function runAllTests() {
        const output = "statusOutput";
        clearOutput(output);

        log("🚀 Executando todos os testes...", "info", output);
        log("", "info", output);

        // Teste 1: Utils
        try {
          if (window.Utils) {
            log("✓ Utils: Carregado", "success", output);
          } else {
            log("✗ Utils: Não carregado", "error", output);
          }
        } catch (e) {
          log(`✗ Utils: Erro - ${e.message}`, "error", output);
        }

        // Teste 2: FormValidator
        try {
          if (window.FormValidator) {
            log("✓ FormValidator: Carregado", "success", output);
          } else {
            log("✗ FormValidator: Não carregado", "error", output);
          }
        } catch (e) {
          log(`✗ FormValidator: Erro - ${e.message}`, "error", output);
        }

        // Teste 3: AuthService
        try {
          if (window.authService) {
            log("✓ AuthService: Carregado", "success", output);
          } else {
            log("✗ AuthService: Não carregado", "error", output);
          }
        } catch (e) {
          log(`✗ AuthService: Erro - ${e.message}`, "error", output);
        }

        // Teste 4: Backend
        log("", "info", output);
        log("Testando conectividade com backend...", "info", output);
        try {
          const response = await fetch("http://localhost:3000/");
          log("✓ Backend: Respondendo", "success", output);
        } catch (error) {
          log("✗ Backend: Não respondendo", "error", output);
        }

        // Teste 5: localStorage
        try {
          if (Utils.hasLocalStorage()) {
            log("✓ localStorage: Disponível", "success", output);
          } else {
            log("✗ localStorage: Não disponível", "error", output);
          }
        } catch (e) {
          log(`✗ localStorage: Erro - ${e.message}`, "error", output);
        }

        // Teste 6: Network
        try {
          const isOnline = navigator.onLine;
          log(
            `${isOnline ? "✓" : "✗"} Rede: ${isOnline ? "Online" : "Offline"}`,
            isOnline ? "success" : "warning",
            output,
          );
        } catch (e) {
          log(`✗ Rede: Erro - ${e.message}`, "error", output);
        }

        log("", "info", output);
        log("✅ Testes concluídos!", "success", output);
      }

      function showEnvironmentInfo() {
        const output = "statusOutput";
        clearOutput(output);

        log("ℹ️ Informações do Ambiente", "info", output);
        log("", "info", output);

        // Navegador
        log(
          `Navegador: ${navigator.userAgent.split(" ").pop()}`,
          "info",
          output,
        );

        // Plataforma
        log(`Plataforma: ${navigator.platform}`, "info", output);

        // Linguagem
        log(`Linguagem: ${navigator.language}`, "info", output);

        // Tamanho da tela
        log(`Resolução: ${screen.width}x${screen.height}`, "info", output);

        // localStorage
        log(
          `localStorage: ${Utils.hasLocalStorage() ? "Disponível" : "Indisponível"}`,
          "info",
          output,
        );

        // Online
        log(
          `Status: ${navigator.onLine ? "Online" : "Offline"}`,
          "info",
          output,
        );

        // Mobile
        log(
          `Dispositivo: ${Utils.isMobile() ? "Mobile" : "Desktop"}`,
          "info",
          output,
        );

        log("", "info", output);
        log("🏠 URL da página", "info", output);
        log(window.location.href, "info", output);
      }

      // Inicializar ao carregar
      window.addEventListener("load", () => {
        log("✓ Página de testes carregada", "success", "statusOutput");
      });
    </script>
  </body>
</html>
