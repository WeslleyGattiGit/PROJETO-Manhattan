<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexa - Cadastro</title>
    <link rel="stylesheet" href="styles/shared.css" />
    <link rel="stylesheet" href="styles/cadastro.css" />
  </head>
  <body>
    <div class="signup-container">
      <div class="signup-card">
        <h1 class="signup-title">Connexa</h1>
        <p class="signup-subtitle">Crie sua conta para começar</p>

        <form id="signupForm" class="signup-form">
          <div class="form-group">
            <label for="nameInput" class="form-label">Nome Completo</label>
            <input
              type="text"
              id="nameInput"
              name="nome"
              class="form-input"
              placeholder="Seu nome completo"
              required
            />
          </div>

          <div class="form-group">
            <label for="emailInput" class="form-label">Email</label>
            <input
              type="email"
              id="emailInput"
              name="email"
              class="form-input"
              placeholder="seu.email@exemplo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="passwordInput" class="form-label">Senha</label>
            <input
              type="password"
              id="passwordInput"
              name="senha"
              class="form-input"
              placeholder="Crie uma senha forte"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPasswordInput" class="form-label"
              >Confirmar Senha</label
            >
            <input
              type="password"
              id="confirmPasswordInput"
              name="confirmarSenha"
              class="form-input"
              placeholder="Confirme sua senha"
              required
            />
          </div>

          <div class="password-requirements">
            <p class="requirements-title">Requisitos da senha:</p>
            <ul class="requirements-list">
              <li id="req-length">
                <span class="requirement-icon">○</span> Mínimo 6 caracteres
              </li>
              <li id="req-uppercase">
                <span class="requirement-icon">○</span> Letra maiúscula
              </li>
              <li id="req-number">
                <span class="requirement-icon">○</span> Número
              </li>
            </ul>
          </div>

          <button type="submit" class="signup-button">Criar Conta</button>
        </form>

        <div class="signup-footer">
          <p class="login-text">
            Já tem conta?
            <a href="login.html" class="login-link">Faça login</a>
          </p>
        </div>
      </div>
    </div>

    <script src="scripts/cadastro.js"></script>
  </body>
</html>
